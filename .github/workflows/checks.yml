name: 项目验收
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
        if: runner.os == 'macOS'
      - run: python -m pip install -r backend/requirements.lock.txt -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q --tb=short
      - run: pnpm test:frontend
      - run: pnpm build
      - run: pnpm test:prelaunch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-review-${{ matrix.os }}
          path: |
            data/visual-review/prelaunch
            data/visual-review/resilience
            data/visual-review/progressive
          retention-days: 7
